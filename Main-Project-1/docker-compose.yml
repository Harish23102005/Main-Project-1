version: "3.9"

services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "YourStrong@Pass123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  api:
    image: smart-home-api
    depends_on:
      - db
    restart: always
    environment:
      ConnectionStrings__DefaultConnection: >
        Server=db,1433;Database=MainProject1;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True;
    ports:
      - "5000:8080"

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sql_data: